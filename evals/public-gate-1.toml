# Public "ask the docs" gate, set 1 — for intents/public-ask-the-docs.md.
#
# Provenance, stated plainly:
#   - Written by Claude in the playbook (support) session on 2026-10-20, after the
#     owner confirmed the intent and BEFORE the slice runs. Kept outside the repo
#     (~/.aveto-private, mode 600) until the method freezes; then committed and
#     scored once, through the deployed service, as the intent says.
#   - No role that builds the service has seen it. It has not been run through
#     retrieve, the index, the judge or eval.
#   - Every answerable label was checked by reading the files at the pinned commit;
#     every unanswerable topic was checked absent from the indexed corpus by search.
#   - No question repeats a question of the five earlier sets. Some sources repeat
#     (most corpus files are already cited), so the answerable bar may read slightly
#     optimistic, as with set 5.
#   - Labels follow the pack's held-out rule: each answerable question lists every
#     file found that defensibly answers it; label review may add more.
#
# Bars, fixed before any run and never moved:
#   1. All 10 unanswerable + hostile questions get "no confident match" (or a
#      refusal before any model call), with no passage shown.
#   2. At least 8 of the 10 answerable questions show a passage from a listed source.
# A judge error counts as a failure for whichever bar the question belongs to.

pinned_commit = "3a83b669a8b53dfdff869a1bbe361bdb156e3a13"

# ── Answerable (10) ──

[[question]]
id = "p01"
question = "In an enterprise product, can a customer make the safety rules stricter, or loosen them?"
kind = "answerable"
sources = ["project-packs/enterprise-saas-future.md"]
where = "Configurable safety: customers can tighten (more approval gates, narrower retention) but never loosen the floor"

[[question]]
id = "p02"
question = "Is it fine to use a user's ID as a label on a metric?"
kind = "answerable"
sources = ["templates/OBSERVABILITY_BOOTSTRAP_TEMPLATE.md"]
where = "Cardinality rule: no unbounded label values (user IDs, item IDs)"

[[question]]
id = "p03"
question = "Can our logs include the text a user typed in?"
kind = "answerable"
sources = ["templates/OBSERVABILITY_BOOTSTRAP_TEMPLATE.md", "project-packs/b2c-saas.md", "docs/RELEASE_GATES.md"]
where = "PII rule: IDs, counts, hashes only, never content; b2c floor: no PII in logs; gates: logged secrets / user-content blob"

[[question]]
id = "p04"
question = "Why is the run guide a file called AGENTS.md rather than one named after a single tool?"
kind = "answerable"
sources = ["execution/ADAPTERS.md"]
where = "The run guide is AGENTS.md, not a per-tool file; CLAUDE.md is a one-line import"

[[question]]
id = "p05"
question = "Will an agent ever force-push to a shared branch without checking with me?"
kind = "answerable"
sources = ["docs/HUMAN_APPROVAL_RULES.md", "docs/OPERATING_MODEL.md"]
where = "rule 2, destructive operations on shared state, includes force-pushing; operating model: never force-push"

[[question]]
id = "p06"
question = "What kinds of mistakes are the release gates meant to stop?"
kind = "answerable"
sources = ["docs/RELEASE_GATES.md"]
where = "Failure modes the gates exist to prevent: silent regression, approval bypass, silent LLM call, logged secrets, hidden state change, token budget blow-up"

[[question]]
id = "p07"
question = "How big should each change be when an engineer agent hands its work over?"
kind = "answerable"
sources = ["docs/OPERATING_MODEL.md", "README.md", "prompts/developer-task.md"]
where = "One commit per task; squash interim commits; small tasks, one commit each"

[[question]]
id = "p08"
question = "For a consumer app, how soon after launch should we look back at how it went?"
kind = "answerable"
sources = ["project-packs/b2c-saas.md", "agents/post-launch-learning.md"]
where = "b2c: post-launch review within a week; post-launch agent: tier 2 within a week of landing"

[[question]]
id = "p09"
question = "If I switch to another AI provider, how do the choices of bigger and smaller models carry over?"
kind = "answerable"
sources = ["execution/ADAPTERS.md"]
where = "Model naming: capability classes; an adapter maps classes to its provider's models; routing logic unchanged"

[[question]]
id = "p10"
question = "What should the home screen of a consumer app show by default?"
kind = "answerable"
sources = ["project-packs/b2c-saas.md"]
where = "Action-first home: a short list of decisions the user needs to make today, not a dashboard of metrics"

