# Retrieval evaluation set — THIRD held-out gate, for docs-retrieval-2-proof.
#
# Committed after slice A froze its method (commit recorded in
# runs/docs-retrieval-2/STATE.md). The gate (intent Decision 1): a correct file
# in the top 5 for at least 80% of answerable questions — 13 of these 16.
# Unanswerable questions are a diagnostic only; they do not gate.
#
# Provenance, stated plainly:
#   - Drafted by Claude in the playbook session, 2026-09-29, while slice A was
#     implementing, and kept outside the repo until the freeze. Reviewed and
#     committed by the owner.
#   - The drafter drafted both earlier sets and has read both runs' results
#     and slice 2's tech spec. It has NOT run retrieval, the index or the eval
#     command on these questions. No role that designed or built retrieval
#     has seen them.
#   - No question repeats a topic from either earlier set, and no source file
#     below is a source in either earlier set. Every source is inside Decision
#     2's corpus; none is an excluded file.
#   - Every `sources` path was checked to contain the answer at the pinned
#     commit 3a83b669a8b53dfdff869a1bbe361bdb156e3a13. Phrased the way a user
#     would ask, not copied from headings. Answered if ANY listed source is in
#     the top 5.

