# Retrieval evaluation set — FIFTH held-out gate, for docs-answerability-2.
#
# Provenance, stated plainly:
#   - Drafted by Claude in the playbook (support) session on 2026-10-09, before
#     the answerability slices ran, and kept outside this repo until the method
#     froze (method commit recorded in runs/docs-answerability-2/STATE.md).
#   - It has NOT been run through retrieve, the index or eval. No role that
#     designed or built retrieval or the judge has seen it.
#   - The working copy was lost on 2026-10-13 and regenerated from its generator
#     script; the regenerated file matches the original's recorded sha256.
#   - Labels follow the pack's "Held-out gates" rule 4: each answerable question
#     lists every file that defensibly answers it. The fresh label-review QA is
#     asked to add any it finds missing and to attack the unanswerable labels.
#   - No question repeats a question or a topic of the four earlier sets. Sources
#     are NOT unique to this set: the earlier sets already cite 96 of the 123
#     corpus files, so a no-reuse rule cannot hold, and 21 of the 24 answerable
#     questions here cite at least one file an earlier set also cites. Retrieval
#     was tuned on those earlier sets, so the second bar may read slightly
#     optimistic on those questions.
#
# The bars, fixed before any run and never moved: abstain correctly on at least
# 80 percent of the unanswerable questions (20 of 24); do not abstain on at
# least 80 percent of the answerable questions whose right file is in the top 5.

