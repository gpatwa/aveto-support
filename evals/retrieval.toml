# Retrieval evaluation set — slice 1.
#
# Drafted by Claude; reviewed and committed by the owner, 2026-09-26, before
# any retrieval code exists. From here it belongs to the owner and QA — the
# engineer who builds retrieval must not edit it.
#
# The rules this set exists to enforce (intent.md, "Done means"):
#   - Written and labelled by the owner or QA, NEVER by the engineer who builds
#     retrieval. An implementer who writes its own test questions is grading
#     its own homework.
#   - Committed BEFORE retrieval is tuned; git history must show it first.
#   - Thresholds are fixed before the run: a correct source in the top 5 for
#     at least 80% of answerable questions; "no confident match" for at least
#     4 of the 5+ unanswerable ones.
#
# How it was drafted:
#   - Every `sources` path was checked to contain the answer at the pinned
#     commit 3a83b669a8b53dfdff869a1bbe361bdb156e3a13 of
#     gpatwa/agentic-sdlc-playbook. `where` names the passage.
#   - Questions are phrased the way a user would ask, NOT copied from headings,
#     so keyword overlap alone does not score them.
#   - A question counts as answered if ANY listed source is in the top 5.
#   - Two unanswerable questions are hard negatives: their keywords ("price",
#     "Windows") appear in the docs in an unrelated sense. They test that
#     "no confident match" works, not just that unrelated words miss.

pinned_commit = "3a83b669a8b53dfdff869a1bbe361bdb156e3a13"

