[project]
name = "aveto-support"
version = "0.1.0"
description = "Aveto support agent: retrieval over pinned documentation (no model)."
requires-python = ">=3.12,<3.13"
dependencies = ["onnxruntime", "numpy"]

[dependency-groups]
dev = ["pytest", "mypy", "ruff"]

[tool.uv]
package = false

[tool.mypy]
strict = true
python_version = "3.12"
files = ["aveto_support", "tests"]

[[tool.mypy.overrides]]
module = ["onnxruntime"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not network and not model'"
markers = [
    "network: hits the pinned GitHub archive and the pinned Hugging Face files (approved fetches)",
    "model: needs the cached, hash-verified model files; no network",
]

[tool.ruff]
target-version = "py312"
