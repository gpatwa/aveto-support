# Retrieval evaluation set — FOURTH held-out gate, for docs-retrieval-3-proof.
#
# Committed after slice A froze its method (commit recorded in
# runs/docs-retrieval-3/STATE.md). The gate (intent "Done means"): a correct
# file in the top 5 for at least 80% of answerable questions — 13 of these 16.
# Unanswerable questions are a diagnostic only; they do not gate.
#
# Provenance, stated plainly:
#   - Drafted by Claude in the playbook session, 2026-09-30, while slice A was
#     implementing, and kept outside the repo until the freeze. Its labels are
#     then reviewed by a fresh QA spawn (intent Decision 2) before the owner
#     commits it; a different fresh QA spawn scores it once.
#   - The drafter drafted all three earlier sets and has read their results
#     and slice 3's spec. It has NOT run retrieval, the index or the eval
#     command on these questions. No role that designed or built retrieval
#     has seen them.
#   - Labels follow the pack's "Held-out gates" rule 4: each lists every file
#     that defensibly answers it — typically the owning agent AND its template
#     or prompt. The label reviewer should add any it finds missing.
#   - No question repeats a topic from an earlier set, and no source file
#     below is a source in any earlier set. Every source is inside the
#     Decision 2 corpus.
#   - Every `sources` path was checked to exist and contain the answer at the
#     pinned commit 3a83b669a8b53dfdff869a1bbe361bdb156e3a13.
#   - Label-reviewed by a fresh QA spawn (only `sources` lists changed; nothing dropped): runs/docs-retrieval-3-proof/01-label-review.md

